<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Paced — Demo Hub</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap { max-width: 720px; width: 100%; }
  h1 { font-size: 1.75rem; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; margin-bottom: 32px; }
  .grid { display: grid; gap: 16px; }
  a.card {
    display: block;
    background: var(--card);
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 20px 24px;
    text-decoration: none;
    color: var(--text);
    transition: border-color .15s, transform .15s;
  }
  a.card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  a.card .name {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 4px;
  }
  a.card .desc {
    color: var(--muted);
    font-size: 0.9rem;
  }
  footer {
    margin-top: 32px;
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>K-Paced — Demo Hub</h1>
    <p class="sub">เลือกหน้าเดโมที่ต้องการเปิดดู</p>
    <div class="grid">
      <a class="card" href="k-paced-demo.html">
        <div class="name">Interactive Demo บน K PLUS</div>
        <div class="desc">k-paced-demo.html</div>
      </a>
      <a class="card" href="k-paced-app.html">
        <div class="name">App Demo</div>
        <div class="desc">k-paced-app.html</div>
      </a>
      <a class="card" href="k-paced-shortfall.html">
        <div class="name">Shortfall Engine (Model 1 demo)</div>
        <div class="desc">k-paced-shortfall.html</div>
      </a>
    </div>
    <footer>K-Paced Demo</footer>
  </div>
</body>
</html>
